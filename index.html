<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBFOUR Co. - Men's Fashion</title>
    <meta name="description" content="SEBFOUR Co. - Premium Men's Fashion. Shop T-shirts, Jeans, Trousers, Hoodies, Shoes & more. Quality styles at affordable prices.">
    <style>
        :root {
            --bg: #f8f6f2;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-light: #5c5c5c;
            --accent: #2c3e2d;
            --accent-light: #4a6b4d;
            --gold: #b8943e;
            --border: #e5e0d8;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --whatsapp: #25d366;
            --whatsapp-dark: #1fa851;
            --red: #c0392b;
            --navy: #1a2744;
            --charcoal: #36454f;
            --olive: #556b2f;
            --khaki: #a89a7e;
            --cream: #f5f0e8;
            --brown: #6b3a2a;
            --grey: #7a7a7a;
            --blue: #3b5998;
            --white: #f9f9f9;
            --black: #1a1a1a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .logo-placeholder {
            width: 180px;
            height: 55px;
            border: 2px dashed #ccc;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            color: #999;
            letter-spacing: 1px;
            background: #fafafa;
            flex-shrink: 0;
            transition: var(--transition);
            cursor: pointer;
            text-transform: uppercase;
        }
        .logo-placeholder:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: #f0f7f1;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .cart-icon-btn {
            position: relative;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .cart-icon-btn:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        .cart-count {
            background: #e74c3c;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 24px;
        }
        .whatsapp-header-btn,
        .whatsapp-header-btn:link,
        .whatsapp-header-btn:visited {
            background: var(--whatsapp);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            white-space: nowrap;
            text-decoration: none;
        }
        .whatsapp-header-btn:hover {
            background: var(--whatsapp-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        /* CATEGORY NAV */
        .category-nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .category-nav::-webkit-scrollbar {
            height: 4px;
        }
        .category-nav::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .category-list {
            display: flex;
            gap: 4px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px 0;
            flex-wrap: nowrap;
        }
        .category-pill {
            padding: 8px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--text-light);
            flex-shrink: 0;
        }
        .category-pill:hover,
        .category-pill.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* MAIN */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            gap: 24px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            flex: 1;
        }

        /* PRODUCT CARD */
        .product-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid transparent;
        }
        .product-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
            border-color: #ddd;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/5;
            overflow: hidden;
            background: #eaeaea;
            cursor: pointer;
        }
        .carousel-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            flex-shrink: 0;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            z-index: 2;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        .carousel-arrow:hover {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        .carousel-arrow.prev {
            left: 8px;
        }
        .carousel-arrow.next {
            right: 8px;
        }
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
        }
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            padding: 0;
        }
        .carousel-dot.active {
            background: #fff;
            width: 20px;
            border-radius: 4px;
        }
        .product-info {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .product-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.2;
        }
        .product-desc {
            font-size: 0.78rem;
            color: var(--text-light);
            line-height: 1.4;
        }
        .color-swatches {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }
        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: var(--transition);
            position: relative;
            flex-shrink: 0;
        }
        .color-swatch:hover {
            transform: scale(1.15);
            border-color: #888;
        }
        .color-swatch.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(44, 62, 45, 0.2);
        }
        .color-swatch.selected::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 2px #000;
        }
        .size-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
        }
        .size-selector label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-light);
            margin-right: 2px;
        }
        .size-option {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .size-option:hover,
        .size-option.selected {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .qty-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .qty-row label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .qty-input {
            width: 55px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1.5px solid var(--border);
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .price-display {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .price-detail {
            font-size: 0.7rem;
            color: var(--text-light);
        }
        .card-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-add-cart {
            flex: 1;
            min-width: 100px;
            padding: 10px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-add-cart:hover {
            background: var(--accent-light);
            box-shadow: var(--shadow-lg);
        }
        .btn-whatsapp-sm {
            padding: 10px 14px;
            background: var(--whatsapp);
            color: #fff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-whatsapp-sm:hover {
            background: var(--whatsapp-dark);
            box-shadow: var(--shadow-lg);
        }

        /* CART PANEL */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .cart-panel {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            max-width: 90vw;
            height: 100vh;
            background: #fff;
            z-index: 2001;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.2);
            transition: right 0.35s ease;
            display: flex;
            flex-direction: column;
            border-radius: 16px 0 0 16px;
        }
        .cart-panel.open {
            right: 0;
        }
        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .cart-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            padding: 4px 10px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .cart-close:hover {
            background: #f0f0f0;
            color: #000;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #fafafa;
            border-radius: var(--radius-sm);
            align-items: center;
            flex-wrap: wrap;
        }
        .cart-item-img {
            width: 60px;
            height: 75px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: #eaeaea;
        }
        .cart-item-info {
            flex: 1;
            min-width: 140px;
        }
        .cart-item-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .cart-item-variant {
            font-size: 0.75rem;
            color: var(--text-light);
        }
        .cart-item-price {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
        }
        .cart-item-remove {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .cart-item-remove:hover {
            background: #c0392b;
        }
        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .cart-total {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .cart-whatsapp-btn {
            width: 100%;
            padding: 14px;
            background: var(--whatsapp);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .cart-whatsapp-btn:hover {
            background: var(--whatsapp-dark);
            box-shadow: var(--shadow-lg);
        }
        .cart-empty {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1rem;
        }

        /* FLOATING WHATSAPP */
        .floating-whatsapp {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1500;
            background: var(--whatsapp);
            color: #fff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 18px rgba(37, 211, 102, 0.4);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border: none;
        }
        .floating-whatsapp:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(37, 211, 102, 0.55);
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: #2c3e2d;
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 3000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.35s ease;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
        }
        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-inner {
                padding: 10px 12px;
                gap: 10px;
            }
            .logo-placeholder {
                width: 130px;
                height: 40px;
                font-size: 1rem;
            }
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 12px;
            }
            .main-container {
                padding: 12px;
                gap: 12px;
            }
            .cart-panel {
                width: 95vw;
                right: -95vw;
            }
            .category-pill {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .floating-whatsapp {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
                bottom: 16px;
                right: 16px;
            }
        }
        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .product-info {
                padding: 8px 10px;
                gap: 4px;
            }
            .product-name {
                font-size: 0.8rem;
            }
            .btn-add-cart,
            .btn-whatsapp-sm {
                font-size: 0.7rem;
                padding: 7px 10px;
            }
            .carousel-arrow {
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="logo-placeholder" title="Upload your SEBFOUR Co. logo here">
                🏷 SEBFOUR Co.
            </div>
            <div class="header-actions">
                <button class="cart-icon-btn" onclick="toggleCart()" aria-label="Open cart">
                    🛒 Cart <span class="cart-count" id="cartCount">0</span>
                </button>
                <!-- This button now sends full cart if not empty -->
                <a class="whatsapp-header-btn" id="whatsappHeaderBtn" href="#" target="_blank" rel="noopener">
                    💬 WhatsApp
                </a>
            </div>
        </div>
    </header>

    <!-- CATEGORY NAV -->
    <nav class="category-nav" id="categoryNav">
        <div class="category-list" id="categoryList"></div>
    </nav>

    <!-- MAIN -->
    <div class="main-container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- CART OVERLAY -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

    <!-- CART PANEL -->
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            🛒 Your Cart
            <button class="cart-close" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">Your cart is empty.<br>Add some stylish pieces!</div>
        </div>
        <div class="cart-footer" id="cartFooter">
            <div class="cart-total"><span>Total:</span> <span id="cartTotal">0 UGX</span></div>
            <a class="cart-whatsapp-btn" id="cartWhatsappBtn" href="#" target="_blank" rel="noopener">
                📱 Order via WhatsApp (full cart)
            </a>
            <p style="font-size:0.7rem; color:#666; margin-top:6px;">This sends your entire cart with all details.</p>
        </div>
    </div>

    <!-- FLOATING WHATSAPP – now also sends full cart if not empty -->
    <a class="floating-whatsapp" id="floatingWhatsapp" href="#" target="_blank" rel="noopener" title="Chat or send your cart" aria-label="WhatsApp">
        💬
    </a>

    <!-- NOTIFICATION -->
    <div class="notification" id="notification"></div>

    <script>
        (function() {
            // ──────────────────────────────────────
            // PRODUCT DATA GENERATOR
            // ──────────────────────────────────────
            const categoryDefs = [
                { slug: 'plain-roundneck', name: 'Plain Roundneck T-shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#f9f9f9', '#1a2744', '#7a7a7a', '#c0392b'], count: 8, desc: 'Classic plain roundneck tee. Soft cotton, comfortable fit.', imgTheme: 'plain-tee' },
                { slug: 'stripe-roundneck', name: 'Stripe Roundneck T-shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a2744', '#f9f9f9', '#36454f', '#c0392b'], count: 7, desc: 'Stylish striped roundneck. Breathable fabric.', imgTheme: 'stripe-tee' },
                { slug: 'longsleeve-tshirt', name: 'Long-Sleeved T-shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#7a7a7a', '#1a2744', '#556b2f', '#f9f9f9'], count: 8, desc: 'Comfortable long-sleeve tee for cooler days.', imgTheme: 'ls-tee' },
                { slug: 'jeans', name: 'Jeans', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#1a2744', '#36454f', '#1a1a1a', '#6b3a2a'], count: 7, desc: 'Premium denim jeans. Durable & stylish.', imgTheme: 'jeans' },
                { slug: 'khaki-trousers', name: 'Khaki Trousers', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#a89a7e', '#556b2f', '#36454f', '#f5f0e8'], count: 6, desc: 'Smart khaki trousers for formal & casual looks.', imgTheme: 'khaki' },
                { slug: 'jumpers-hoodies', name: 'Jumpers/Hoodies', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#7a7a7a', '#1a2744', '#c0392b', '#556b2f'], count: 8, desc: 'Warm & cozy jumpers and hoodies.', imgTheme: 'hoodie' },
                { slug: 'longsleeve-shirts', name: 'Long-Sleeved Shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#f9f9f9', '#1a2744', '#a89a7e', '#36454f', '#c0392b'], count: 7, desc: 'Sharp long-sleeved button-up shirts.', imgTheme: 'ls-shirt' },
                { slug: 'shortsleeve-shirts', name: 'Short-Sleeved Shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#f9f9f9', '#1a2744', '#556b2f', '#c0392b', '#7a7a7a'], count: 8, desc: 'Breezy short-sleeved shirts for summer.', imgTheme: 'ss-shirt' },
                { slug: 'sweaterpants', name: 'Sweaterpants', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#1a1a1a', '#7a7a7a', '#36454f'], count: 6, desc: 'Comfortable sweaterpants for lounging.', imgTheme: 'sweatpant' },
                { slug: 'shorts', name: 'Shorts', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#a89a7e', '#1a2744', '#1a1a1a', '#f5f0e8', '#556b2f'], count: 7, desc: 'Casual shorts for warm weather.', imgTheme: 'shorts' },
                { slug: 'sneakers-formal', name: 'Sneakers/Formal Shoes', type: 'footwear', sizes: ['40', '41', '42', '43', '44', '45'], colors: ['#1a1a1a', '#6b3a2a', '#f9f9f9', '#36454f'], count: 8, desc: 'Stylish sneakers & formal shoes.', imgTheme: 'sneaker' },
                { slug: 'open-shoes', name: 'Open Shoes', type: 'footwear', sizes: ['40', '41', '42', '43', '44', '45'], colors: ['#6b3a2a', '#1a1a1a', '#a89a7e'], count: 6, desc: 'Comfortable open shoes & sandals.', imgTheme: 'openshoe' },
                { slug: 'underwear', name: 'Underwear', type: 'underwear', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#f9f9f9', '#7a7a7a', '#1a2744'], count: 5, desc: 'Soft cotton underwear for daily comfort.', imgTheme: 'underwear' },
                { slug: 'jean-jackets', name: 'Jean Jackets', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a2744', '#36454f', '#1a1a1a', '#7a7a7a'], count: 6, desc: 'Classic denim jackets. Layer up in style.', imgTheme: 'jean-jacket' },
                { slug: 'armless', name: 'Armless', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#f9f9f9', '#7a7a7a', '#c0392b'], count: 5, desc: 'Sleeveless tops for a bold look.', imgTheme: 'armless' },
                { slug: 'beltless-trousers', name: 'Beltless Trousers', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#1a1a1a', '#36454f', '#a89a7e', '#556b2f'], count: 5, desc: 'Modern beltless trousers with clean lines.', imgTheme: 'beltless' },
                { slug: 'cargopants', name: 'Cargopants', type: 'bottom', sizes: ['30', '31', '32', '33', '34', '36', '38', '40'], colors: ['#a89a7e', '#556b2f', '#1a1a1a', '#36454f'], count: 6, desc: 'Utility cargopants with multiple pockets.', imgTheme: 'cargo' },
                { slug: 'rubbertshirts', name: 'Rubber T-shirts', type: 'top', sizes: ['S', 'M', 'XL', 'XXL', '3XL'], colors: ['#1a1a1a', '#c0392b', '#1a2744', '#f9f9f9', '#7a7a7a'], count: 5, desc: 'Unique rubber-print t-shirts with bold designs.', imgTheme: 'rubber-tee' },
            ];

            const allProducts = [];
            let productIdCounter = 1;
            categoryDefs.forEach(cat => {
                for (let i = 1; i <= cat.count; i++) {
                    const productColors = cat.colors;
                    const defaultColor = productColors[0];
                    const product = {
                        id: productIdCounter++,
                        name: `${cat.name} #${i}`,
                        category: cat.slug,
                        categoryName: cat.name,
                        type: cat.type,
                        sizes: [...cat.sizes],
                        colors: [...productColors],
                        selectedColor: defaultColor,
                        selectedSize: cat.sizes[0],
                        quantity: 1,
                        desc: cat.desc,
                        imgTheme: cat.imgTheme,
                        images: productColors.reduce((acc, colorHex) => {
                            const cleanHex = colorHex.replace('#', '');
                            acc[colorHex] = [
                                `https://placehold.co/400x500/${cleanHex}/ffffff?text=${encodeURIComponent(cat.imgTheme + '-front')}`,
                                `https://placehold.co/400x500/${cleanHex}/f0f0f0?text=${encodeURIComponent(cat.imgTheme + '-back')}`,
                                `https://placehold.co/400x500/${cleanHex}/e8e8e8?text=${encodeURIComponent(cat.imgTheme + '-detail')}`,
                            ];
                            return acc;
                        }, {}),
                        currentSlide: 0,
                    };
                    allProducts.push(product);
                }
            });

            // ──────────────────────────────────────
            // STATE
            // ──────────────────────────────────────
            let cart = JSON.parse(localStorage.getItem('sebfour_cart') || '[]');
            let activeCategory = 'all';
            const whatsappNumber = '+256757306640';

            // ──────────────────────────────────────
            // PRICING LOGIC
            // ──────────────────────────────────────
            function getPriceForQty(qty) {
                if (qty >= 3) return Math.round(2500 + (qty - 3) * 800);
                if (qty === 2) return 1800;
                return 1000;
            }

            function getUnitPrice(qty) {
                return Math.round(getPriceForQty(qty) / qty);
            }

            // ──────────────────────────────────────
            // CART FUNCTIONS
            // ──────────────────────────────────────
            function saveCart() {
                localStorage.setItem('sebfour_cart', JSON.stringify(cart));
                updateCartUI();
                updateAllWhatsAppLinks();
            }

            function addToCart(productData) {
                const { productId, name, color, size, quantity, images } = productData;
                const existingIdx = cart.findIndex(
                    item => item.productId === productId && item.color === color && item.size === size
                );
                if (existingIdx >= 0) {
                    cart[existingIdx].quantity += quantity;
                } else {
                    cart.push({
                        cartItemId: Date.now(),
                        productId,
                        name,
                        color,
                        size,
                        quantity,
                        images: images || [],
                    });
                }
                recalcCartPrices();
                saveCart();
                showNotification('✅ Added to cart!');
            }

            function removeFromCart(cartItemId) {
                cart = cart.filter(item => item.cartItemId !== cartItemId);
                recalcCartPrices();
                saveCart();
            }

            function recalcCartPrices() {
                const productQtyMap = {};
                cart.forEach(item => {
                    productQtyMap[item.productId] = (productQtyMap[item.productId] || 0) + item.quantity;
                });
                cart.forEach(item => {
                    const totalSameProduct = productQtyMap[item.productId] || item.quantity;
                    const totalForAllSame = getPriceForQty(totalSameProduct);
                    const unitP = Math.round(totalForAllSame / totalSameProduct);
                    item.unitPrice = unitP;
                    item.subtotal = unitP * item.quantity;
                });
            }

            function getCartTotal() {
                return cart.reduce((sum, item) => sum + (item.subtotal || item.quantity * 1000), 0);
            }

            function getCartCount() {
                return cart.reduce((sum, item) => sum + item.quantity, 0);
            }

            function buildCartWhatsAppMessage() {
                if (cart.length === 0) return '';
                let msg = `🛒 *SEBFOUR Co. - New Order*%0A%0A`;
                cart.forEach((item, idx) => {
                    msg += `${idx+1}. *${item.name}*%0A   Color: ${item.color} | Size: ${item.size} | Qty: ${item.quantity} | ${item.subtotal || item.quantity*1000} UGX%0A`;
                });
                msg += `%0A💰 *Total: ${getCartTotal().toLocaleString()} UGX*%0A%0APlease confirm my order. Thank you!`;
                return msg;
            }

            function updateAllWhatsAppLinks() {
                const msg = buildCartWhatsAppMessage();
                const baseUrl = `https://wa.me/${whatsappNumber.replace('+', '')}`;
                const fullUrl = msg ? `${baseUrl}?text=${msg}` : baseUrl;

                // Header button
                const headerBtn = document.getElementById('whatsappHeaderBtn');
                if (headerBtn) headerBtn.href = fullUrl;

                // Floating button
                const floatingBtn = document.getElementById('floatingWhatsapp');
                if (floatingBtn) floatingBtn.href = fullUrl;

                // Cart footer button (already updated in updateCartUI, but keep consistent)
                const cartBtn = document.getElementById('cartWhatsappBtn');
                if (cartBtn) cartBtn.href = fullUrl;
            }

            function updateCartUI() {
                const count = getCartCount();
                document.getElementById('cartCount').textContent = count;
                const cartItemsEl = document.getElementById('cartItems');
                const cartTotalEl = document.getElementById('cartTotal');
                const cartWhatsappBtn = document.getElementById('cartWhatsappBtn');

                if (cart.length === 0) {
                    cartItemsEl.innerHTML = '<div class="cart-empty">Your cart is empty.<br>Add some stylish pieces!</div>';
                } else {
                    cartItemsEl.innerHTML = cart.map(item => {
                        const imgSrc = (item.images && item.images[0]) || 'https://placehold.co/60x75/ddd/999?text=Item';
                        return `
                        <div class="cart-item">
                            <img class="cart-item-img" src="${imgSrc}" alt="${item.name}" loading="lazy">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-variant">Color: ${item.color} | Size: ${item.size} | Qty: ${item.quantity}</div>
                                <div class="cart-item-price">${item.subtotal || item.quantity * 1000} UGX (${item.unitPrice || 1000} UGX each)</div>
                            </div>
                            <button class="cart-item-remove" onclick="window.removeFromCart(${item.cartItemId})">Remove</button>
                        </div>`;
                    }).join('');
                }
                const total = getCartTotal();
                cartTotalEl.textContent = total.toLocaleString() + ' UGX';

                // Update cart WhatsApp button
                const msg = buildCartWhatsAppMessage();
                const baseUrl = `https://wa.me/${whatsappNumber.replace('+', '')}`;
                const fullUrl = msg ? `${baseUrl}?text=${msg}` : baseUrl;
                if (cartWhatsappBtn) cartWhatsappBtn.href = fullUrl;

                // Also update header and floating buttons
                updateAllWhatsAppLinks();
            }

            function toggleCart() {
                const panel = document.getElementById('cartPanel');
                const overlay = document.getElementById('cartOverlay');
                const isOpen = panel.classList.contains('open');
                if (isOpen) {
                    panel.classList.remove('open');
                    overlay.classList.remove('open');
                } else {
                    panel.classList.add('open');
                    overlay.classList.add('open');
                }
            }

            window.removeFromCart = function(cartItemId) {
                removeFromCart(cartItemId);
            };
            window.toggleCart = toggleCart;

            function showNotification(msg) {
                const notif = document.getElementById('notification');
                notif.textContent = msg;
                notif.classList.add('show');
                clearTimeout(notif._timeout);
                notif._timeout = setTimeout(() => {
                    notif.classList.remove('show');
                }, 2000);
            }

            // ──────────────────────────────────────
            // RENDER PRODUCTS
            // ──────────────────────────────────────
            function renderProducts(categoryFilter = 'all') {
                const grid = document.getElementById('productsGrid');
                const filtered = categoryFilter === 'all' ? allProducts : allProducts.filter(p => p.category === categoryFilter);

                grid.innerHTML = filtered.map(product => {
                    const imgs = product.images[product.selectedColor] || Object.values(product.images)[0];
                    const slidesHTML = imgs.map((src, i) => `
                        <div class="carousel-slide" data-slide="${i}">
                            <img src="${src}" alt="${product.name} - view ${i+1}" loading="${i===0?'eager':'lazy'}" onerror="this.src='https://placehold.co/400x500/e0e0e0/888?text=SEBFOUR+Co.'">
                        </div>`).join('');

                    const colorSwatchesHTML = product.colors.map(c => {
                        const selClass = c === product.selectedColor ? ' selected' : '';
                        return `<button class="color-swatch${selClass}" style="background:${c};" data-color="${c}" title="${c}" aria-label="Color ${c}"></button>`;
                    }).join('');

                    const sizeOptionsHTML = product.sizes.map(s => {
                        const selClass = s === product.selectedSize ? ' selected' : '';
                        return `<button class="size-option${selClass}" data-size="${s}">${s}</button>`;
                    }).join('');

                    const qty = product.quantity || 1;
                    const priceTotal = getPriceForQty(qty);
                    const unitP = getUnitPrice(qty);

                    return `
                    <div class="product-card" data-product-id="${product.id}" data-category="${product.category}">
                        <div class="carousel-container" data-product-id="${product.id}">
                            <div class="carousel-slides" data-product-id="${product.id}" style="transform:translateX(0%);">
                                ${slidesHTML}
                            </div>
                            <button class="carousel-arrow prev" data-product-id="${product.id}" onclick="window.slideCarousel(${product.id}, -1)">‹</button>
                            <button class="carousel-arrow next" data-product-id="${product.id}" onclick="window.slideCarousel(${product.id}, 1)">›</button>
                            <div class="carousel-dots" data-product-id="${product.id}">
                                ${imgs.map((_, i) => `<button class="carousel-dot${i===0?' active':''}" data-product-id="${product.id}" data-dot="${i}" onclick="window.goToSlide(${product.id}, ${i})"></button>`).join('')}
                            </div>
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-desc">${product.desc}</div>
                            <div class="color-swatches" data-product-id="${product.id}">
                                ${colorSwatchesHTML}
                            </div>
                            <div class="size-selector" data-product-id="${product.id}">
                                <label>Size:</label> ${sizeOptionsHTML}
                            </div>
                            <div class="qty-row">
                                <label>Qty:</label>
                                <input class="qty-input" type="number" min="1" max="99" value="${qty}" data-product-id="${product.id}" onchange="window.updateQty(${product.id}, this.value)">
                            </div>
                            <div class="price-display">${priceTotal.toLocaleString()} UGX</div>
                            <div class="price-detail">(${unitP.toLocaleString()} UGX each for ${qty} item${qty>1?'s':''})</div>
                            <div class="card-buttons">
                                <button class="btn-add-cart" onclick="window.addProductToCart(${product.id})">🛒 Add to Cart</button>
                                <button class="btn-whatsapp-sm" onclick="window.orderSingleViaWhatsApp(${product.id})">📱 Order</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                attachProductEvents();
            }

            function attachProductEvents() {
                document.querySelectorAll('.color-swatch').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const color = this.dataset.color;
                        const card = this.closest('.product-card');
                        const productId = parseInt(card.dataset.productId);
                        const product = allProducts.find(p => p.id === productId);
                        if (!product) return;
                        product.selectedColor = color;
                        card.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                        updateCarouselImages(card, product);
                        product.currentSlide = 0;
                        const slidesEl = card.querySelector('.carousel-slides');
                        if (slidesEl) slidesEl.style.transform = 'translateX(0%)';
                        updateDots(card, product, 0);
                    });
                });

                document.querySelectorAll('.size-option').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const size = this.dataset.size;
                        const card = this.closest('.product-card');
                        const productId = parseInt(card.dataset.productId);
                        const product = allProducts.find(p => p.id === productId);
                        if (!product) return;
                        product.selectedSize = size;
                        card.querySelectorAll('.size-option').forEach(s => s.classList.remove('selected'));
                        this.classList.add('selected');
                    });
                });
            }

            function updateCarouselImages(card, product) {
                const imgs = product.images[product.selectedColor] || Object.values(product.images)[0];
                const slides = card.querySelectorAll('.carousel-slide img');
                slides.forEach((img, i) => {
                    if (imgs[i]) {
                        img.src = imgs[i];
                        img.onerror = function() { this.src = 'https://placehold.co/400x500/e0e0e0/888?text=SEBFOUR+Co.'; };
                    }
                });
                const dotsContainer = card.querySelector('.carousel-dots');
                if (dotsContainer) {
                    dotsContainer.innerHTML = imgs.map((_, i) =>
                        `<button class="carousel-dot${i===0?' active':''}" data-product-id="${product.id}" data-dot="${i}" onclick="window.goToSlide(${product.id}, ${i})"></button>`
                    ).join('');
                }
            }

            function updateDots(card, product, activeIdx) {
                const dots = card.querySelectorAll('.carousel-dot');
                dots.forEach((d, i) => { d.classList.toggle('active', i === activeIdx); });
            }

            window.slideCarousel = function(productId, direction) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                const imgs = product.images[product.selectedColor] || Object.values(product.images)[0];
                const totalSlides = imgs.length;
                product.currentSlide = (product.currentSlide + direction + totalSlides) % totalSlides;
                const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
                if (card) {
                    const slidesEl = card.querySelector('.carousel-slides');
                    if (slidesEl) slidesEl.style.transform = `translateX(-${product.currentSlide * 100}%)`;
                    updateDots(card, product, product.currentSlide);
                }
            };

            window.goToSlide = function(productId, slideIdx) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                product.currentSlide = slideIdx;
                const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
                if (card) {
                    const slidesEl = card.querySelector('.carousel-slides');
                    if (slidesEl) slidesEl.style.transform = `translateX(-${slideIdx * 100}%)`;
                    updateDots(card, product, slideIdx);
                }
            };

            window.updateQty = function(productId, value) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                const qty = Math.max(1, Math.min(99, parseInt(value) || 1));
                product.quantity = qty;
                const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
                if (card) {
                    const priceTotal = getPriceForQty(qty);
                    const unitP = getUnitPrice(qty);
                    const priceDisplay = card.querySelector('.price-display');
                    const priceDetail = card.querySelector('.price-detail');
                    if (priceDisplay) priceDisplay.textContent = priceTotal.toLocaleString() + ' UGX';
                    if (priceDetail) priceDetail.textContent = `(${unitP.toLocaleString()} UGX each for ${qty} item${qty>1?'s':''})`;
                }
            };

            window.addProductToCart = function(productId) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                const imgs = product.images[product.selectedColor] || Object.values(product.images)[0];
                addToCart({
                    productId: product.id,
                    name: product.name,
                    color: product.selectedColor,
                    size: product.selectedSize,
                    quantity: product.quantity || 1,
                    images: imgs,
                });
            };

            window.orderSingleViaWhatsApp = function(productId) {
                const product = allProducts.find(p => p.id === productId);
                if (!product) return;
                const qty = product.quantity || 1;
                const priceTotal = getPriceForQty(qty);
                const msg = `🛒 *SEBFOUR Co. - Order*%0A%0A*${product.name}*%0AColor: ${product.selectedColor}%0ASize: ${product.selectedSize}%0AQty: ${qty}%0ATotal: ${priceTotal.toLocaleString()} UGX%0A%0APlease confirm. Thank you!`;
                window.open(`https://wa.me/${whatsappNumber.replace('+','')}?text=${msg}`, '_blank');
            };

            // ──────────────────────────────────────
            // CATEGORY NAV
            // ──────────────────────────────────────
            function renderCategoryNav() {
                const navList = document.getElementById('categoryList');
                const categories = [
                    { slug: 'all', name: '🏠 All Products' },
                    ...categoryDefs.map(c => ({ slug: c.slug, name: c.name })),
                ];
                navList.innerHTML = categories.map(cat => {
                    const activeClass = cat.slug === activeCategory ? ' active' : '';
                    return `<button class="category-pill${activeClass}" data-category="${cat.slug}">${cat.name}</button>`;
                }).join('');

                navList.querySelectorAll('.category-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        activeCategory = this.dataset.category;
                        navList.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        renderProducts(activeCategory);
                        document.getElementById('productsGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                });
            }

            // ──────────────────────────────────────
            // INIT
            // ──────────────────────────────────────
            function init() {
                recalcCartPrices();
                updateCartUI();
                renderCategoryNav();
                renderProducts('all');
                updateAllWhatsAppLinks(); // set initial hrefs for header & floating buttons
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        const panel = document.getElementById('cartPanel');
                        if (panel.classList.contains('open')) toggleCart();
                    }
                });
                console.log('✅ SEBFOUR Co. – all WhatsApp buttons now send full cart details.');
            }

            init();
        })();
    </script>
</body>
</html>
